name: Build & Publish Release APK

on:
  push:
    tags:
      - 'v*'
      - 'release-*'
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Release version tag (e.g. v1.0.1 - leave empty to auto-detect)'
        required: false
        default: ''
      is_prerelease:
        description: 'Mark as prerelease (true/false)'
        required: false
        type: boolean
        default: false
      custom_notes:
        description: 'Custom release notes (optional)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-release:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java Development Kit (JDK)
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Setup Environment Files
        run: |
          # Secrets Gradle Plugin requires .env to exist
          if [ ! -f .env ]; then
            if [ -f .env.example ]; then
              cp .env.example .env
            else
              touch .env
            fi
          fi

      - name: Determine Version Tag
        id: get_version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.version_tag }}" ]; then
            TAG="${{ github.event.inputs.version_tag }}"
          elif [ -n "${{ github.ref_name }}" ] && [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${{ github.ref_name }}"
          else
            # Extract version from app/build.gradle.kts or fallback to v1.0.0
            VER_NAME=$(grep 'versionName' app/build.gradle.kts | head -n 1 | sed -E 's/.*"([^"]+)".*/\1/' || echo "1.0.0")
            TAG="v${VER_NAME}"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Version Tag determined: $TAG"

      - name: Configure Keystore & Signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD_SECRET: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD_SECRET: ${{ secrets.KEY_PASSWORD }}
        run: |
          mkdir -p "$HOME/keystore"
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Using custom release keystore from repository secret..."
            echo "$KEYSTORE_BASE64" | base64 -d > "$HOME/keystore/release.jks"
            echo "KEYSTORE_PATH=$HOME/keystore/release.jks" >> $GITHUB_ENV
            echo "STORE_PASSWORD=${STORE_PASSWORD_SECRET:-android}" >> $GITHUB_ENV
            echo "KEY_PASSWORD=${KEY_PASSWORD_SECRET:-android}" >> $GITHUB_ENV
          else
            echo "Generating consistent CI release signing keystore..."
            keytool -genkeypair -v \
              -keystore "$HOME/keystore/release.jks" \
              -alias "upload" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "radioglobe_ci_release_pass" \
              -keypass "radioglobe_ci_release_pass" \
              -dname "CN=RadioGlobe, OU=Mobile, O=RadioGlobe, L=World, ST=World, C=US"
            echo "KEYSTORE_PATH=$HOME/keystore/release.jks" >> $GITHUB_ENV
            echo "STORE_PASSWORD=radioglobe_ci_release_pass" >> $GITHUB_ENV
            echo "KEY_PASSWORD=radioglobe_ci_release_pass" >> $GITHUB_ENV
          fi

      - name: Grant Execute Permission to Gradle Wrapper
        run: chmod +x ./gradlew

      - name: Build Release APK
        env:
          GRADLE_OPTS: "-Djava.awt.headless=true -Dorg.gradle.configuration-cache=false"
          JAVA_OPTS: "-Djava.awt.headless=true"
        run: ./gradlew assembleRelease -Dksp.useKSP2=true -Djava.awt.headless=true -Dorg.gradle.jvmargs="-Xmx4g -Dfile.encoding=UTF-8 -Djava.awt.headless=true" --no-configuration-cache --stacktrace

      - name: Build Debug APK (Optional Testing Asset)
        env:
          GRADLE_OPTS: "-Djava.awt.headless=true -Dorg.gradle.configuration-cache=false"
          JAVA_OPTS: "-Djava.awt.headless=true"
        run: ./gradlew assembleDebug -Dksp.useKSP2=true -Djava.awt.headless=true -Dorg.gradle.jvmargs="-Xmx4g -Dfile.encoding=UTF-8 -Djava.awt.headless=true" --no-configuration-cache --stacktrace

      - name: Prepare APK Assets for Release
        id: prepare_assets
        run: |
          mkdir -p release-assets
          TAG="${{ steps.get_version.outputs.tag }}"

          # Copy and rename Release APK
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk "release-assets/RadioGlobe-${TAG}.apk"
            cp app/build/outputs/apk/release/app-release.apk "release-assets/RadioGlobe-release.apk"
          fi

          # Copy and rename Debug APK
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk "release-assets/RadioGlobe-${TAG}-debug.apk"
          fi

          ls -lh release-assets/

      - name: Generate Release Notes
        id: release_notes
        run: |
          TAG="${{ steps.get_version.outputs.tag }}"
          if [ -n "${{ github.event.inputs.custom_notes }}" ]; then
            cat << 'EOF' > release_body.md
          ${{ github.event.inputs.custom_notes }}
          EOF
          else
            cat << EOF > release_body.md
          ## 📻 World Radio Globe $TAG

          Yeni sürüm hazır! Android telefonunuzdan doğrudan **Obtainium** ile güncelleyebilirsiniz.

          ### 📦 İndirme & Kurulum
          - **Tavsiye Edilen (Obtainium):** \`RadioGlobe-${TAG}.apk\`
          - **Alternatif:** \`RadioGlobe-release.apk\`
          - **Test / Hata Ayıklama:** \`RadioGlobe-${TAG}-debug.apk\`

          ### 📲 Obtainium Ayarları
          1. Obtainium uygulamasını açın.
          2. **Add App (Uygulama Ekle)** butonuna tıklayın.
          3. Bu GitHub deposunun URL'sini yapıştırın:
             \`${{ github.server_url }}/${{ github.repository }}\`
          4. Otomatik olarak en güncel \`.apk\` dosyasını algılayıp yükleyecek ve gelecekteki güncellemeleri bildirecektir.
          EOF
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_version.outputs.tag }}
          name: "World Radio Globe ${{ steps.get_version.outputs.tag }}"
          body_path: release_body.md
          draft: false
          prerelease: ${{ github.event.inputs.is_prerelease || false }}
          generate_release_notes: true
          files: |
            release-assets/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
